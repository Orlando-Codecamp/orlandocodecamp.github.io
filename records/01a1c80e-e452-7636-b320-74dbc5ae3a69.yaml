objective: The Orlando Code Camp site no longer presents 2026 event content as part of the 2027 event; each 2026-driven section is hidden or replaced by a short coming-soon note, the 2026 sponsors are thanked as last year's sponsors, and each hidden section comes back by filling in or flipping a value in _config.yml.
criteria:
  - The speakers page shows no 2026 keynote (no Isabella Johnston name, photo, or talk). While the speaker list's Sessionize id is blank, it shows no Sessionize speaker list, no Confirmed Speakers heading, and no sentence saying the speakers below have confirmed their attendance. In their place a short note says the 2027 keynote and speakers will be announced. While call_for_speakers_url is blank the note says the call for speakers has not opened yet; when it is filled in, the note links to it instead. The note carries the keynote anchor, so /keynote/ still lands on it.
  - While the agenda's Sessionize id is blank, the sessions page shows no agenda, schedule builder, calendar download, or day-of events (check-in, lunch, snack break, after-party), and makes no request to Sessionize. It shows a short note that the 2027 sessions and schedule will be posted once speakers are selected. While the speaker and session embed id (the same id the speakers page uses) is blank, the sessions tag cloud page shows the same kind of note instead of its Confirmed Sessions heading and the 2026 session list. /schedule/ still redirects to /sessions/.
  - The sponsors page still shows every sponsor in _data/sponsors.yml with its name and logo, and the home page sponsor section still shows the logo of every sponsor that has a Platinum, Gold, Silver, or Bronze level, as it does now. On both pages the sponsors sit under a heading that thanks them as 2026 sponsors (along the lines of Thank You to Our 2026 Sponsors). Beside that heading a sentence says the organizers are looking for 2027 sponsors and links to the Become a Sponsor page. The sentence calling them the confirmed sponsors so far, with more to come, is gone, and neither page describes them as sponsors of the 2027 event.
  - While a single _config.yml value keeps pricing hidden (its default), the become-a-sponsor page shows no dollar amount, no discount badge, and no deadline date. The three pricing rows under the sponsorship levels table, the price on each additional opportunity card, the early-payment note below the additional opportunities, and the Important Deadlines section are not rendered. A short note in their place says 2027 sponsorship pricing and deadlines are being finalized and gives sponsors@orlandocodecamp.com as a mailto link. The levels table's benefit rows and every additional opportunity's name and benefits still render. Flipping that one value renders the pricing rows, the opportunity prices, the early-payment note, and the deadlines again with no other edit.
  - While a second _config.yml value keeps them hidden (its default), the become-a-sponsor page shows no Claimed by banner on any additional sponsorship opportunity, even though the 2026 sponsors in _data/sponsors.yml keep their sponsorType values; each opportunity card shows its Available badge instead. Flipping that value brings the Claimed by banners back with no other edit, and flipping the pricing value alone does not. The page has no link to Orlando-Code-Camp-2026-Sponsor-Info.pdf.
  - The attendees and location pages no longer name Dunkin, Jason's Deli, or 4th Street Bar & Grill, no longer show the after-party address, phone number, website, or map, and no longer say attendees choose a sandwich during Eventbrite registration; a short note says the 2027 food and after-party details are coming soon. The attendees page still says breakfast, lunch, an afternoon snack, and drinks are provided, that there is an after-party, and how the sponsor raffle works. The location page keeps the venue address and map, campus entrances, airports, and hotels. While registration_url is blank, the attendees page says registration is coming soon in one place, not in both a heading and a banner.
  - While volunteer_url is blank, the volunteers page opens with the note that sign-up opens soon rather than a heading asking visitors to join the volunteer team now; when volunteer_url is filled in, that heading and the Register as a Volunteer button return. The volunteers@orlandocodecamp.com address on the page is a mailto link.
  - |-
    Every Sessionize identifier the speakers, sessions, and sessions tag cloud pages use (the speaker and session embed id, the agenda API id, and the speaker-location question id) is read from _config.yml and ships blank, following the blank-value pattern PR #78 introduced for registration_url, volunteer_url, and call_for_speakers_url. The speakers list and the tag cloud list are both gated on the embed id, and the agenda on the agenda API id. A build with those values filled in renders the speaker list with its heading, the tag cloud list with its heading, and the agenda, with no template edit. The day-of events kept in the sessions page front matter no longer name the 2026 food vendors, snack sponsor, or after-party venue, so filling in the agenda id does not bring those names back.
  - LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 bundle exec jekyll build succeeds with the shipped _config.yml. A search of the built HTML finds none of Isabella Johnston, Dunkin, Jason, 4th Street, sandwich, Claimed by, ze7ieij7, er10xu03, 112742, or Orlando-Code-Camp-2026-Sponsor-Info.pdf, and no dollar amount on the become-a-sponsor page. (The search uses Jason rather than the full vendor name because the attendees page renders its apostrophe as a curly quote.) Apart from the footer copyright year, which the footer computes from the build date, the string 2026 and the names of 2026 sponsors appear only in the sponsor thank-you sections of the sponsors page and the home page.
