context: |-
  ## Rulings (operator, 2026-11-10; do not reopen)

  - Do not get fancy. This is a prep pass, not a redesign and not a 2026 retrospective. Hide 2026-driven content or put a one or two sentence placeholder in its place, reusing existing styles (`banner banner-info`, `info-card`, `teaser-card`).
  - The one exception is sponsors: thank the 2026 sponsors by name and logo, with a line that we are looking for 2027 sponsors.
  - The sponsorship prices on the site are not accurate for 2027, so they are hidden until the organizers supply new ones. The deadline dates go with them: the discount deadlines mean nothing without prices, and the logo and booth dates are unconfirmed.
  - Key off PR #78 (merged as 7679009). It made registration, volunteer sign-up, and the call for speakers fall back to an opens-soon note while their `_config.yml` values are blank (see `_config.yml` near line 26, `index.md` near line 37, `volunteers.md` near line 12, `_includes/call-for-speakers-banner.html` near line 27). Do the same for the Sessionize-backed pages and for sponsor pricing: gate markup in Liquid rather than deleting it, so an organizer restores it by filling in or flipping a value. Gate with Liquid, not HTML comments, because HTML comments ship in the built page.

  ## Where things are (at 7679009)

  - `speakers.md`: keynote card lines 9 to 28 (hand-written 2026 content; it may be deleted, since the 2027 keynote will be a new card); the Confirmed Speakers heading and attendance sentence at lines 32 to 34, which go behind the same gate as the list; Sessionize embed `ze7ieij7` at line 37. `keynote.md` redirects to `/speakers/#keynote`, so whatever replaces the card keeps `id="keynote"`.
  - `sessions.html`: `bookend_events` front matter lines 11 to 68 (vendor and venue names at 15, 33, 52, 63 and 64); agenda root at line 71 with `data-api-id="er10xu03"` and `data-location-question-id="112742"`; the bookend JSON and the `app.js` module script at lines 78 and 80. `assets/js/agenda/app.js` already treats a missing location question id as none (line 93) and only mounts when `#agenda-app` exists (end of file). The layout is `_layouts/full-width.html`, which renders the page `description` and hero button in the hero.
  - `sessions-tagcloud.md`: the Confirmed Sessions heading at line 9 and embed `ze7ieij7` at line 12, the same id as the speakers embed. The tag cloud is gated on that embed id, not on the agenda id.
  - `sponsors.md`: heading and confirmed-so-far sentence at lines 21 to 23; it lists every sponsor in `_data/sponsors.yml`. `index.md`: sponsor section heading at lines 62 to 64; its rows (lines 67 onward) show only sponsors with a Platinum, Gold, Silver, or Bronze level, by logo with the name in `alt` and `title`. Dynabyte and CODE Magazine have no level, so they are not on the home page today; do not add a row for them.
  - `become-a-sponsor.md`: date gates at lines 9 to 13; pricing rows in the table footer at lines 121 to 143; claimed-by loop at lines 154 to 166, matching `sponsorType` in `_data/sponsors.yml` against `_data/sponsor_opportunities.yml`; opportunity price at line 169; the early-payment note at line 180 explains pricing and goes behind the pricing gate; Important Deadlines at lines 249 to 295; PDF link at line 310. Leave the PDF file itself in `assets/doc/`. The claimed-by banners get their own `_config.yml` value, separate from the pricing value, because the `sponsorType` values for CyberMedics, DNSimple, and Dynabyte stay in the data; while that value hides them, the existing Available badge at line 165 shows on every card.
  - `attendees.md`: registration heading and banner at lines 9 to 24, Food at lines 30 to 37, After-Party venue card and map at lines 49 to 69.
  - `location.md`: After-Party Venue section at lines 149 to 173.
  - `volunteers.md`: call-to-action block at lines 9 to 22.
  - `_includes/footer.html` line 73 prints the copyright year from `site.time`, so a build run in 2026 shows 2026 in every page footer. That is expected and is the one exception to the 2026 search in the last criterion.

  ## Leave alone

  The sponsorship tiers and their benefits, the commented-out nav register buttons, the unused includes (`keynote-highlight-section.html`, `call-for-speakers-banner.html`, `clock02.html`), the countdown, the footer, `keynote.md` and `schedule-redirect.html` (both redirects), and the Code of Conduct, community, and partners pages. Existing copy that is not 2026-specific stays as it is.

  ## Verifying the restore path

  Build once with the shipped config, then again with an override file that fills in the Sessionize values and flips the pricing and claimed-by values, for example `bundle exec jekyll build --config _config.yml,<override.yml> -d <dir>`, and confirm the hidden sections render. Build into a directory outside the source tree or into the ignored `_site/`.

  ## Writing rules

  All new site copy, commit messages, and the PR follow these: no em dashes (the `&mdash;` entity renders one, so it counts), full sentences, and no AI attribution.
