  Title: Announce the 19th annual Orlando Code Camp on April 17, 2027

  Work item: [#77](https://github.com/Orlando-Codecamp/orlandocodecamp.github.io/issues/77)

  This updates the site for the 2027 event at Seminole State College. The year, the "19th Annual" label and the date are changed everywhere they appear, and the countdown now targets 7:30 AM EDT on April 17, 2027.

  We don't have 2027 Eventbrite, PlanHero or Sessionize links yet, so I didn't want the 2027 wording sitting next to buttons that go to the closed 2026 events. The links now come from `registration_url`, `volunteer_url` and `call_for_speakers_url` in `_config.yml`. While those are blank, the site shows a short "opens soon" note instead of the button, and the attendees page says "Registration Coming Soon". That means the home page won't have a register button until somebody fills in `registration_url`, which I think is the right call. Let me know if you'd rather keep it up.

  The sponsor page's discount and deadline checks now use the same calendar dates in 2027, so the early-payment discounts no longer show as "Expired". A couple of things still need an organizer: the sponsor PDF link still serves the 2026 PDF, and the logo and booth deadlines (Mar 11 and Mar 28) may need to move by six days to match the later event date.
  ```
