context: |-
  ## Scope

  This is a text and date change for the 2027 event. Links and data that point at 2026-specific external pages (Eventbrite, Sessionize, PlanHero, the sponsor PDF), the sponsor-tier deadline dates in `become-a-sponsor.md`, and the 2026 sponsor list stay as they are. They need new URLs or new data that do not exist yet, so they belong to a separate cleanup. Note for the orchestrator: no follow-up task for that cleanup exists in the store yet.

  ## Facts already checked

  - April 17, 2027 is a Saturday, and US daylight saving time is in effect (it starts March 14, 2027), so 7:30 AM Eastern is 11:30 UTC. In `Date.UTC` the month is zero-based, so April is `3`.
  - The site calls the 2026 event the 18th annual in four places (`index.md`, `become-a-sponsor.md`, `_includes/hero.html`, `_includes/call-for-speakers-banner.html`); the 2027 event is the 19th.
  - `_includes/hero.html` and `_includes/call-for-speakers-banner.html` are not included by any page at this commit, so they do not show up in `_site`. Update them anyway so they are correct if they are used again.
  - `README.md` is in the `exclude` list in `_config.yml`, so only the source check covers it.
  - The site description in `_config.yml` is the fallback for the description meta tags (`_layouts/default.html` uses `page.description | default: site.description`), so it renders on pages without their own description, such as the home page and `404.html`, and in the `feed.xml` subtitle. Pages with their own front-matter description show that instead.
  - `assets/js/clock02.js` (loaded only by `_includes/clock02.html`, which no page includes), `assets/js/agenda/ics.js` (a comment only; its time zone rules are generic), and `assets/js/agenda/dev-mock.js` (development fixture data) mention 2026 but are out of scope.

  ## Building

  The Sass step fails with `Invalid US-ASCII character "\xE2"` when the shell has no UTF-8 locale. Run the build as `LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 bundle exec jekyll build`.
